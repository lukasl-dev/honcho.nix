name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31

      - name: Check package and service
        run: nix flake check

      - name: Check formatting and workflows
        run: |
          nix develop --command nixfmt --check ./*.nix ./honcho/*.nix ./honcho-cli/*.nix ./pi-honcho-memory/*.nix ./tests/*.nix
          nix develop --command actionlint
