name: cron

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: cron
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Install Nix
        uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31

      - name: Update Honcho
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nix run .#update
          if git diff --quiet -- flake.nix flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$(jq -r .nodes.honcho.original.ref flake.lock)" >> "$GITHUB_OUTPUT"
          fi

      - name: Check package and service
        if: steps.update.outputs.changed == 'true'
        run: nix flake check

      - name: Commit and tag checked update
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.update.outputs.version }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.nix flake.lock
          git commit -m "Update Honcho to $VERSION"

          if ! git ls-remote --tags --refs origin "refs/tags/$VERSION" | grep -q .; then
            git tag -a "$VERSION" -m "$VERSION"
            git push --atomic origin "HEAD:$BRANCH" "refs/tags/$VERSION"
          else
            git push origin "HEAD:$BRANCH"
          fi
